<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PacketPulse — Forgot Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {min-height: 100vh;background: #0b0f1a;display: flex; align-items: center; justify-content: center;font-family: 'Segoe UI', system-ui, sans-serif;color: #e2e8f0;}
    .card {background: #111827;border: 1px solid #1e2d45;border-radius: 14px;padding: 40px 36px;width: 100%;max-width: 420px;box-shadow: 0 20px 60px rgba(0,0,0,0.5);}
    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .logo em { color: #2563eb; font-style: normal; }
    .subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 28px; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .desc { font-size: 0.875rem; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .field input {width: 100%; padding: 11px 14px;background: #1e293b; border: 1px solid #2d3f55;border-radius: 7px; color: #e2e8f0; font-size: 0.9rem; font-family: inherit;transition: border-color 0.15s;}
    .field input:focus { outline: none; border-color: #2563eb; }
    .btn {width: 100%; padding: 12px;background: #2563eb; color: #fff; border: none;border-radius: 7px; font-size: 0.9rem; font-weight: 600;cursor: pointer; font-family: inherit; transition: opacity 0.15s;}
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {margin-top: 16px; padding: 11px 14px;border-radius: 7px; font-size: 0.85rem; display: none;}
    .msg.show { display: block; }
    .msg.success { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .msg.error   { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
    .back-link:hover { color: #94a3b8; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Packet<em>Pulse</em></div>
  <div class="subtitle">Network Scanner</div>
  <h2>Reset your password</h2>
  <p class="desc">Enter your email address and we'll send you a link to reset your password.</p>

  <div id="form-section">
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <button class="btn" id="btn-submit" onclick="submitForgot()">Send Reset Link</button>
    <div class="msg" id="msg"></div>
  </div>

  <a href="login.html" class="back-link">← Back to login</a>
</div>

<script>
const API_BASE = '';

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitForgot();
});

async function submitForgot() {
  const email = document.getElementById('email').value.trim();
  const btn   = document.getElementById('btn-submit');
  const msg   = document.getElementById('msg');

  if (!email) { showMsg('Please enter your email address.', 'error'); return; }

  btn.disabled    = true;
  btn.textContent = 'Sending…';
  showMsg('', '');

  try {
    const resp = await fetch(API_BASE + '/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await resp.json();

    if (resp.ok) {
      showMsg(data.data.message, 'success');
      document.getElementById('email').value = '';
    } else {
      showMsg(data.error || 'Something went wrong.', 'error');
    }
  } catch(e) {
    showMsg('Could not reach the server. Please try again.', 'error');
  }

  btn.disabled    = false;
  btn.textContent = 'Send Reset Link';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className   = 'msg' + (type ? ' show ' + type : '');
}
</script>
</body>
</html>
