<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PacketPulse — Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {min-height: 100vh; background: #0b0f1a;display: flex; align-items: center; justify-content: center;font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0;}
    .card {background: #111827; border: 1px solid #1e2d45;border-radius: 14px; padding: 40px 36px;width: 100%; max-width: 420px;box-shadow: 0 20px 60px rgba(0,0,0,0.5);}
    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .logo em { color: #2563eb; font-style: normal; }
    .subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 28px; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .field input {width: 100%; padding: 11px 14px;background: #1e293b; border: 1px solid #2d3f55;border-radius: 7px; color: #e2e8f0; font-size: 0.9rem; font-family: inherit;transition: border-color 0.15s;}
    .field input:focus { outline: none; border-color: #2563eb; }
    .strength { height: 4px; border-radius: 2px; background: #2d3f55; margin-top: 6px; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
    .btn {width: 100%; padding: 12px; background: #2563eb; color: #fff;border: none; border-radius: 7px; font-size: 0.9rem; font-weight: 600;cursor: pointer; font-family: inherit; transition: opacity 0.15s;}
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 11px 14px; border-radius: 7px; font-size: 0.85rem; display: none; }
    .msg.show { display: block; }
    .msg.success { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .msg.error   { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
    .back-link:hover { color: #94a3b8; }
    .invalid-state { text-align: center; padding: 20px 0; }
    .invalid-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .invalid-state p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Packet<em>Pulse</em></div>
  <div class="subtitle">Network Scanner</div>

  <div id="form-section">
    <h2>Set new password</h2>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="new-pw" autocomplete="new-password" placeholder="At least 12 characters" oninput="checkStrength(this.value)">
      <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
      <div class="strength-label" id="strength-label">At least 12 characters</div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="confirm-pw" autocomplete="new-password" placeholder="Repeat your new password">
    </div>
    <button class="btn" id="btn-submit" onclick="submitReset()">Set New Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="invalid-section" style="display:none" class="invalid-state">
    <div class="icon">⚠️</div>
    <p>This reset link is invalid or has expired.</p>
    <a href="forgot-password.html" style="color:#2563eb;font-size:0.875rem">Request a new reset link →</a>
  </div>

  <a href="login.html" class="back-link">← Back to login</a>
</div>

<script>
const API_BASE = '';
const params   = new URLSearchParams(window.location.search);
const token    = params.get('token') || '';

if (!token) {
  document.getElementById('form-section').style.display    = 'none';
  document.getElementById('invalid-section').style.display = 'block';
}

async function submitReset() {
  const newPw     = document.getElementById('new-pw').value;
  const confirmPw = document.getElementById('confirm-pw').value;
  const btn       = document.getElementById('btn-submit');

  if (newPw.length < 12) { showMsg('Password must be at least 12 characters.', 'error'); return; }
  if (newPw !== confirmPw) { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled    = true;
  btn.textContent = 'Saving…';
  showMsg('', '');

  try {
    const resp = await fetch(API_BASE + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: newPw }),
    });
    const data = await resp.json();

    if (resp.ok) {
      showMsg(data.data.message, 'success');
      document.getElementById('form-section').querySelectorAll('input').forEach(i => i.value='');
      setTimeout(() => window.location.href = 'login.html', 2500);
    } else {
      showMsg(data.error || 'Something went wrong.', 'error');
      if (resp.status === 400 && data.error && data.error.includes('expired')) {
        document.getElementById('form-section').style.display    = 'none';
        document.getElementById('invalid-section').style.display = 'block';
      }
    }
  } catch(e) {
    showMsg('Could not reach the server. Please try again.', 'error');
  }

  btn.disabled    = false;
  btn.textContent = 'Set New Password';
}

function checkStrength(pw) {
  const bar   = document.getElementById('strength-bar');
  const label = document.getElementById('strength-label');
  let score = 0;
  if (pw.length >= 12)          score++;
  if (pw.length >= 16)          score++;
  if (/[A-Z]/.test(pw))        score++;
  if (/[0-9]/.test(pw))        score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const labels = ['Very weak','Weak','Fair','Strong','Very strong'];
  bar.style.width      = Math.min(100, score * 20) + '%';
  bar.style.background = colors[score-1] || '#ef4444';
  label.textContent    = score === 0 ? 'At least 12 characters' : labels[score-1];
  label.style.color    = colors[score-1] || '#64748b';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className   = 'msg' + (type ? ' show ' + type : '');
}
</script>
</body>
</html>
