#  PacketPulse - Docker Compose
#
#  SERVICES:
#    db       - Postgres database (Docker)
#    frontend - Nginx static server + API proxy (Docker)
#
#  BACKEND runs natively on Windows via start.ps1
#  giving it direct access to your physical network for scanning.
#
#  To start everything:    .\start.ps1
#  To stop everything:     .\stop.ps1
#
#  VOLUMES:
#    postgres-data - persists database across restarts.
#    Only destroyed with: docker-compose down -v

version: "3.9"

services:

  # DATABASE
  # Exposed on host port 5433 so native backend and pgAdmin can connect.
  # init.sql runs automatically on first start to create all tables.
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"                        #allow connection for example to pgadmin
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - packetpulse-net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout:  5s
      retries:  10
  
  # BACKEND
  # build: ./backend
  #   Docker reads backend/Dockerfile and builds the image. The build context is the backend/ directory, so COPY . in the Dockerfile copies backend/ contents.
  # env_file: .env
  #   Loads all variables from .env into the container's
  #   environment. This is how DB_HOST, JWT_SECRET, SMTP_*
  #   etc. reach the Python process without being hardcoded.
  #
  # depends_on: db: condition: service_healthy
  #   Docker won't start the backend until the db healthcheck
  #   passes. This prevents "connection refused" crashes on
  #   startup when Postgres is still initialising.
  #
  # networks:
  #   Only on the internal network — not exposed to host.
  #   Nginx proxies to it internally via http://backend:8000.
  #   The backend port is intentionally NOT published here.
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - packetpulse-net
  # FRONTEND
  # Nginx serves static files and proxies /api/ to the native
  # backend running on the Windows host at port 8000.
  # host.docker.internal resolves to the Windows host IP from
  # inside the container - this is how Nginx reaches the backend.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://host.docker.internal:8000
    depends_on:
      - db
    networks:
      - packetpulse-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

# NAMED VOLUMES
volumes:
  postgres-data:

# NETWORKS
networks:
  packetpulse-net:
    driver: bridge