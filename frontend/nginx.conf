# ──────────────────────────────────────────────────────────────
#  PacketPulse — Nginx Configuration
#
#  Nginx here does two jobs:
#
#  1. STATIC FILE SERVER
#     Serves all HTML, CSS, JS files directly from /usr/share/nginx/html.
#     This is extremely fast — Nginx is purpose-built for this.
#     Python should never serve static files in production.
#
#  2. REVERSE PROXY for /api/
#     Any request starting with /api/ is forwarded internally
#     to the backend container (http://backend:8000).
#
#     "backend" is the Docker service name defined in
#     docker-compose.yml. Docker's internal DNS resolves
#     service names to container IPs automatically.
#     The browser never knows the backend exists separately —
#     it just sees one server at port 80.
#
#  Why this matters:
#     Without this, the browser would need to call
#     http://localhost:8000 directly, which:
#       - Breaks CORS in production
#       - Exposes your backend port publicly
#       - Breaks when you move to a real domain
#     With this proxy, everything goes through port 80/443
#     and the backend is never directly exposed.
# ──────────────────────────────────────────────────────────────

server {
    # Listen on port 80 inside the container
    # docker-compose maps this to port 3000 on your host
    listen 80;

    # Serve static files from this directory
    # The frontend Dockerfile copies all HTML/CSS/JS here
    root /usr/share/nginx/html;

    # Default file to serve when a directory is requested
    index index.html;

    # ── Static files ─────────────────────────────────────────
    # Try to serve the requested file directly.
    # If not found, fall back to index.html (for SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy ─────────────────────────────────────────────
    # Forward all /api/ requests to the Python backend.
    # proxy_pass        — where to forward the request
    # proxy_set_header  — pass the original Host and client IP
    #                     to the backend so it knows who called
    # proxy_http_version 1.1 — use HTTP/1.1 for keepalive support
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — scans can take a while
        # proxy_read_timeout is how long Nginx waits for the
        # backend to respond. Default is 60s which is too short
        # for a full subnet scan. Set to 5 minutes.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ── Security headers ──────────────────────────────────────
    # Basic hardening. In production you'd expand these.
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "same-origin"  always;

    # ── Gzip compression ─────────────────────────────────────
    # Compresses JS/CSS/HTML before sending to the browser.
    # Reduces transfer size by ~70% — faster page loads.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}